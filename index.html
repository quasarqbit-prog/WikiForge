<script>
var PAGES = [{"title":"Главная","content":"# WikiForge — Генератор офлайн-вики\n\n**Один HTML-файл. Никаких зависимостей. Работает полностью офлайн.**\n\nWikiForge — это ультимативный инструмент для создателей модификаций, дата-паков, игровых сборок и инди-проектов, которым нужна структурированная, функциональная документация.\n\nВам больше не нужно разворачивать тяжелые локальные сервера, использовать сторонний софт или заставлять игроков читать сырые текстовые файлы. Вы просто открываете генератор в любом браузере, оформляете базу знаний и создаете полноценный автономный сайт.\n\n### Ключевые возможности:\n\n- **Single-File Архитектура:** Весь инструмент — это один легкий файл. Итоговая собранная вики — это тоже один чистый HTML-файл, который запускается на любом устройстве без интернета. Идеально для кастомных сборок и архивов с модами!\n- **Удобный редактор с Markdown:** Пишите статьи, оформляйте списки, таблицы и интерактивные спойлеры для скрытия сюжета или тяжелых технических данных. Встроенные хоткеи и панель быстрой разметки сделают работу мгновенной.\n- **Глубокая кастомизация дизайна:** Меняйте темы оформления (от темной до лесной и сепии), настраивайте шрифты, ширину контента и отступы на лету под стилистику вашего проекта.\n- **Локальный контроль версий (Бэкапы):** Создавайте именованные снимки состояния проекта прямо внутри программы. Вы защищены от случайной потери данных и можете в любой момент откатиться к нужной точке сохранения.\n- **Переносимый формат `.wfk`:** Экспортируйте исходники своего проекта в один файл. Формат `.wfk` бережно сохраняет не только текущие страницы и настройки дизайна, но и всю историю ваших внутренних бэкапов. Вдобавок, исходник `.wfk` автоматически вшивается в готовую вики, позволяя отредактировать её в любой момент.\n- **Клиентский поиск:** Готовая вики оснащена мощным поисковым движком с поддержкой точного совпадения, поиска по ключевым словам и динамическим показом сниппетов (кусочков текста вокруг найденного слова).\n\nПросто напишите гайд, нажмите кнопку **«Собрать вики»** — и ваш проект получит интерактивный учебник, готовый к отправке пользователям!"},{"title":"1. Главная и Ввод","content":"# Первое что видно при открытии программы\n## 🖥️ Главный экран приложения\n\nПри открытии WikiForge вас встречает хаб со всеми вашими сохранёнными проектами. Они хранятся автоматически прямо в браузере (`localStorage`) — ничего не теряется между сессиями.\n\n### Что находится на карточке каждого проекта:\n- **Живая миниатюра** — уменьшенный предпросмотр первой страницы с реальным отображением цветов выбранной вами темы.\n- **Основная информация** — название проекта, его текущая версия и краткое описание.\n- **Информация** — количество страниц в вики и дата последнего изменения.\n- **Управление** — кнопки «Редактировать» для перехода в рабочую зону и «Удалить» для полной очистки.\n- **⚙️ Кнопка «ⅴ Версии»** — открывает панель истории созданных бэкапов прямо на карточке проекта.\n\n### ⏳ История версий и бэкапы:\nВы можете сохранить снимок текущую версию вики в любой момент — система запомнит состояние всех страниц и настроек дизайна на текущую секунду. Но не забудьте поменять тег версии, чтоб не запутается, так как бэкап берёт название из версии вики.\n* Все бэкапы отображаются в списке с точной датой и временем.\n* Одним кликом можно откатиться к любой созданной ранее версии.\n\n---"},{"title":"2. Редактор и Markdown","content":"# ✍️ Интерфейс Редактора и Markdown\n\nРабочее пространство WikiForge разделено на три зоны: левая панель с редактором и предпросмотром, нижняя панель навигации по страницам и правая панель глобальных настроек.\n\n## Левая панель: Редактор и Предпросмотр\n\nВы можете мгновенно переключаться между двумя режимами работы:\n1. **▢ Редактор** — удобное поле для написания текста в формате Markdown. Сверху расположено поле для ввода заголовка текущей страницы.\n2. **◉ Предпросмотр** — живой рендер страницы. Сразу показывает, как будет выглядеть результат. Фон, цвета и шрифты меняются в реальном времени при редактировании вики.\n\n---\n\n## 🛠️ Панель инструментов Markdown\n\nВ верхней части редактора расположены кнопки для быстрой вставки форматирования без ручного ввода символов:\n\n- **B** — Жирный текст (`**текст**` / **текст** )\n- *I* — Курсив (`*текст*` / *текст*)\n- Ø — Зачёркнутый (`~~текст~~` / ~~текст~~)\n- **H1 / H2 / H3** — Заголовки разных уровней (`#`, `##`, `###`)\n# текст 1\n## текст 2\n### текст 3\n- **•** — Маркированный список (`-`)\n- **1.** — Нумерованный список (`1.`)\n- **❝** — Цитата или блок внимания (`>`)\n> Текст **Текст** *Текст* ~~Текст ~~ ~~** *Текст* **~~\n- **`</>`** — Инлайн-код (`’код’`)\n- **&#9668;/&#9658;** — Многострочный блок кода (` ’’’ текст ’’’ `)\n```\nТекст, Текст, Текст, Текст, Текст, Текст.\nТекст, Текст, Текст, Текст, Текст, Текст, Текст, Текст, Текст.\n```\n- **🔗** — Вставка ссылки (`[текст ссылки](url)`/ [текст ссылки](https://t.me/SandD_DapRatt))\n- **—** — Горизонтальный разделитель (`---`)\n---\n- **⊞** — Готовая разметка таблицы 3×2 которую можно расширить.\n\n| Колонка 1 | Колонка 2 | Колонка 3 |\n|-----------|-----------|------------|\n| Ячейка    | Ячейка    | Ячейка     |\n| Ячейка    | Ячейка    | Ячейка     |\n\n\n- **▨** — Скрытый текст (`:::spoiler текст:::`/ :::spoiler текст:::)\n\n### Кастомные спойлеры\nСинтаксис `:::spoiler текст:::` размывает контент (эффект блюра). Текст станет четким только после того, как пользователь кликнет по нему. Отлично подходит для скрытия сюжета или квестовых разгадок. Работает как в предпросмотре, так и в финальной сборке.\n\n---\n\n## Нижняя панель навигации\n\nЭлемент управления внизу экрана позволяет быстро переключать структуру:\n`‹   стр. 2 / 5   +   Название страницы   ›   🗑`\n\n* **‹** и **›** — переключение между созданными страницами.\n* **+** — создает новую чистую страницу.\n* **🗑** — безвозвратно удаляет текущую страницу.\n\n---"},{"title":"3. Хоткеи и Кастомизация","content":"# ⚙️ Кастомизация дизайна и Хоткеи\n\nПравая панель отвечает за то, как ваша вики будет выглядеть для конечного пользователя. Все изменения сохраняются на лету.\n\n## ⌨️ Горячие клавиши (Хоткеи)\nИспользование клавиатурных комбинаций значительно ускоряет написание больших гайдов:\n\n| Комбинация | Действие |\n|------------|----------|\n| **Ctrl + B** | Сделать выделенный текст **жирным** |\n| **Ctrl + I** | Сделать выделенный текст *курсивом* |\n| **Alt + ←** | Перейти на предыдущую страницу |\n| **Alt + →** | Перейти на следующую страницу |\n\n---\n\n## 🎨 Настройка внешнего вида (Дизайн)\n\nВ блоке «Дизайн» доступны встроенные темы оформления, адаптированные под разные игровые сеттинги:\n\n- **Тёмная** — Глубокий темный фон и золотой акцент (тема по умолчанию).\n- **Светлая** — Чистый кремовый фон, приятный для чтения длинных текстов.\n- **Сепия** — Тёплые коричневые тона, создающие атмосферу старой книги или свитка.\n- **Лесная** — Уютная тёмно-зелёная палитра.\n- **Океан** — Глубокие, строгие синие тона.\n- **🛠️ Своя тема** — Открывает палитру для полной кастомизации. Вы можете вручную настроить цвета фона, шапки, текста и акцентных элементов.\n\n### 📐 Разметка и Шрифты:\n- **Выбор шрифта:** На выбор доступны *Crimson Pro*, *Georgia*, *Inter*, *JetBrains Mono* и *Palatino*.\n- **Размер текста:** Ползунок с диапазоном от 14 до 22px.\n- **Ширина контента:** 4 режима отображения (Узкая / Стандарт / Широкая / На весь экран).\n- **Элементы интерфейса:** Вы можете парой чекбоксов отключить или включить: шапку с поиском, боковое меню, нижнюю навигацию, кнопку возврата «Наверх» и автоматическое «Содержание» в собранной вики.\n---"},{"title":"4. Сохранение и Экспорт (.wfk)","content":"# 💾 Сохранение проекта и Форматы Экспорта\n\nВ WikiForge реализована надежная многоуровневая система сохранения, которая защищает вашу работу от случайных сбоев, закрытия вкладок или потери компьютера.\n\n## 🔄 Умное автосохранение\nВам не нужно искать кнопку «Сохранить» после каждой строчки. Инструмент автоматически записывает все изменения в базу данных браузера (`localStorage`) через **0.8 секунды** после того, как вы перестали вводить текст. При этом индикатор в правом верхнем углу меняет статус на «сохранено».\n\n---\n\n## 📂 Доступные форматы экспорта\n\nВ самом низу правой панели управления находятся две главные кнопки для вывода данных:\n\n### 1. Собрать вики (Финальный HTML)\nЭта кнопка генерирует и скачивает чистый, самодостаточный файл с расширением `.html`. \n- Это **готовый продукт** для ваших игроков.\n- Из него полностью вырезан режим редактирования, лишние кнопки и панели настроек.\n- Файл весит минимум, открывается мгновенно и имеет красивый пользовательский интерфейс. Закиньте его в архив с вашим проектом!\n\n### 2. ↓ Экспорт проекта .wfk (Исходник)\nЭта кнопка скачивает специальный файл проекта с расширением `.wfk` (формат на базе JSON). \n- Это **ваш рабочий исходник**.\n- Он содержит не просто текущий текст, а абсолютно всё: структуру страниц, кастомные настройки цветов, размеры шрифтов и **всю историю ваших именованных бэкапов**!\n- Вы можете перенести этот файл на другой ПК, отправить соавтору или импортировать через главный экран WikiForge для продолжения работы.\n---"},{"title":"5. Возможности собранной вики","content":"# Как устроена готовая вики-страница\n\nФинальный HTML-файл, который скачивают ваши пользователи — это полноценный, интерактивный и современный сайт документации. Несмотря на то, что он состоит из одного файла, в него вшиты мощные функции:\n\n### 🔍 Умный поисковый движок\nВ шапку страницы встроен локальный поиск, работающий в трех режимах:\n1. **По стр.** — мгновенно ищет совпадения только по заголовкам страниц базы знаний.\n2. **По словам** — находит все страницы, на которых встречаются введенные слова, даже если они написаны в разном порядке.\n3. **Точно** — жесткое и точное совпадение фразы. Поиск подсвечивает найденный текст и выводит интерактивный сниппет (кусочек текста вокруг слова) в результатах для удобства чтения.\n\n### Автоматическое «Содержание» (TOC)\nНа каждой странице автоматически сканируются заголовки уровней H1, H2 и H3. Из них строится кликабельное оглавление. Пользователь может кликнуть по пункту и страница плавно прокрутится к нужному разделу.\n\n### Полная автономность и Офлайн\nФинальный файл занимает всего около ~75 КБ и не требует подключения к интернету. Все скрипты поиска, стили тем и навигация находятся прямо внутри кода. Если у пользователя нет сети, страница автоматически переключится на красивые системные шрифты, сохранив всю верстку.\n\n### Кнопка «↓ .wfk» (Редактирование на лету)\nВ правом нижнем углу готовой вики находится небольшая плавающая кнопка. Если вы (или ваш соавтор) нажмете на нее, страница позволит скачать `.wfk` исходник проекта. Загрузите этот файл обратно в генератор WikiForge — и вы снова сможете редактировать свой гайд!\n\n---\n\n## ℹ️ Кнопка информации в генераторе\nНе забывайте про кнопку **ℹ** в шапке редактора: при наведении на нее прямо во время работы появится компактное всплывающее окно-шпаргалка по Markdown-тегам, хоткеям и режимам работы поиска.\n---"}];
var WIKI = {"name":"Вики про WikiForge.","version":"v1.1 / правки","tagline":"Информация про то как пользоваться генератором офлайн-вики и демонстрация возможностей программы.","pages":[{"title":"Главная","content":"# WikiForge — Генератор офлайн-вики\n\n**Один HTML-файл. Никаких зависимостей. Работает полностью офлайн.**\n\nWikiForge — это ультимативный инструмент для создателей модификаций, дата-паков, игровых сборок и инди-проектов, которым нужна структурированная, функциональная документация.\n\nВам больше не нужно разворачивать тяжелые локальные сервера, использовать сторонний софт или заставлять игроков читать сырые текстовые файлы. Вы просто открываете генератор в любом браузере, оформляете базу знаний и создаете полноценный автономный сайт.\n\n### Ключевые возможности:\n\n- **Single-File Архитектура:** Весь инструмент — это один легкий файл. Итоговая собранная вики — это тоже один чистый HTML-файл, который запускается на любом устройстве без интернета. Идеально для кастомных сборок и архивов с модами!\n- **Удобный редактор с Markdown:** Пишите статьи, оформляйте списки, таблицы и интерактивные спойлеры для скрытия сюжета или тяжелых технических данных. Встроенные хоткеи и панель быстрой разметки сделают работу мгновенной.\n- **Глубокая кастомизация дизайна:** Меняйте темы оформления (от темной до лесной и сепии), настраивайте шрифты, ширину контента и отступы на лету под стилистику вашего проекта.\n- **Локальный контроль версий (Бэкапы):** Создавайте именованные снимки состояния проекта прямо внутри программы. Вы защищены от случайной потери данных и можете в любой момент откатиться к нужной точке сохранения.\n- **Переносимый формат `.wfk`:** Экспортируйте исходники своего проекта в один файл. Формат `.wfk` бережно сохраняет не только текущие страницы и настройки дизайна, но и всю историю ваших внутренних бэкапов. Вдобавок, исходник `.wfk` автоматически вшивается в готовую вики, позволяя отредактировать её в любой момент.\n- **Клиентский поиск:** Готовая вики оснащена мощным поисковым движком с поддержкой точного совпадения, поиска по ключевым словам и динамическим показом сниппетов (кусочков текста вокруг найденного слова).\n\nПросто напишите гайд, нажмите кнопку **«Собрать вики»** — и ваш проект получит интерактивный учебник, готовый к отправке пользователям!"},{"title":"1. Главная и Ввод","content":"# Первое что видно при открытии программы\n## 🖥️ Главный экран приложения\n\nПри открытии WikiForge вас встречает хаб со всеми вашими сохранёнными проектами. Они хранятся автоматически прямо в браузере (`localStorage`) — ничего не теряется между сессиями.\n\n### Что находится на карточке каждого проекта:\n- **Живая миниатюра** — уменьшенный предпросмотр первой страницы с реальным отображением цветов выбранной вами темы.\n- **Основная информация** — название проекта, его текущая версия и краткое описание.\n- **Информация** — количество страниц в вики и дата последнего изменения.\n- **Управление** — кнопки «Редактировать» для перехода в рабочую зону и «Удалить» для полной очистки.\n- **⚙️ Кнопка «ⅴ Версии»** — открывает панель истории созданных бэкапов прямо на карточке проекта.\n\n### ⏳ История версий и бэкапы:\nВы можете сохранить снимок текущую версию вики в любой момент — система запомнит состояние всех страниц и настроек дизайна на текущую секунду. Но не забудьте поменять тег версии, чтоб не запутается, так как бэкап берёт название из версии вики.\n* Все бэкапы отображаются в списке с точной датой и временем.\n* Одним кликом можно откатиться к любой созданной ранее версии.\n\n---"},{"title":"2. Редактор и Markdown","content":"# ✍️ Интерфейс Редактора и Markdown\n\nРабочее пространство WikiForge разделено на три зоны: левая панель с редактором и предпросмотром, нижняя панель навигации по страницам и правая панель глобальных настроек.\n\n## Левая панель: Редактор и Предпросмотр\n\nВы можете мгновенно переключаться между двумя режимами работы:\n1. **▢ Редактор** — удобное поле для написания текста в формате Markdown. Сверху расположено поле для ввода заголовка текущей страницы.\n2. **◉ Предпросмотр** — живой рендер страницы. Сразу показывает, как будет выглядеть результат. Фон, цвета и шрифты меняются в реальном времени при редактировании вики.\n\n---\n\n## 🛠️ Панель инструментов Markdown\n\nВ верхней части редактора расположены кнопки для быстрой вставки форматирования без ручного ввода символов:\n\n- **B** — Жирный текст (`**текст**` / **текст** )\n- *I* — Курсив (`*текст*` / *текст*)\n- Ø — Зачёркнутый (`~~текст~~` / ~~текст~~)\n- **H1 / H2 / H3** — Заголовки разных уровней (`#`, `##`, `###`)\n# текст 1\n## текст 2\n### текст 3\n- **•** — Маркированный список (`-`)\n- **1.** — Нумерованный список (`1.`)\n- **❝** — Цитата или блок внимания (`>`)\n> Текст **Текст** *Текст* ~~Текст ~~ ~~** *Текст* **~~\n- **`</>`** — Инлайн-код (`’код’`)\n- **&#9668;/&#9658;** — Многострочный блок кода (` ’’’ текст ’’’ `)\n```\nТекст, Текст, Текст, Текст, Текст, Текст.\nТекст, Текст, Текст, Текст, Текст, Текст, Текст, Текст, Текст.\n```\n- **🔗** — Вставка ссылки (`[текст ссылки](url)`/ [текст ссылки](https://t.me/SandD_DapRatt))\n- **—** — Горизонтальный разделитель (`---`)\n---\n- **⊞** — Готовая разметка таблицы 3×2 которую можно расширить.\n\n| Колонка 1 | Колонка 2 | Колонка 3 |\n|-----------|-----------|------------|\n| Ячейка    | Ячейка    | Ячейка     |\n| Ячейка    | Ячейка    | Ячейка     |\n\n\n- **▨** — Скрытый текст (`:::spoiler текст:::`/ :::spoiler текст:::)\n\n### Кастомные спойлеры\nСинтаксис `:::spoiler текст:::` размывает контент (эффект блюра). Текст станет четким только после того, как пользователь кликнет по нему. Отлично подходит для скрытия сюжета или квестовых разгадок. Работает как в предпросмотре, так и в финальной сборке.\n\n---\n\n## Нижняя панель навигации\n\nЭлемент управления внизу экрана позволяет быстро переключать структуру:\n`‹   стр. 2 / 5   +   Название страницы   ›   🗑`\n\n* **‹** и **›** — переключение между созданными страницами.\n* **+** — создает новую чистую страницу.\n* **🗑** — безвозвратно удаляет текущую страницу.\n\n---"},{"title":"3. Хоткеи и Кастомизация","content":"# ⚙️ Кастомизация дизайна и Хоткеи\n\nПравая панель отвечает за то, как ваша вики будет выглядеть для конечного пользователя. Все изменения сохраняются на лету.\n\n## ⌨️ Горячие клавиши (Хоткеи)\nИспользование клавиатурных комбинаций значительно ускоряет написание больших гайдов:\n\n| Комбинация | Действие |\n|------------|----------|\n| **Ctrl + B** | Сделать выделенный текст **жирным** |\n| **Ctrl + I** | Сделать выделенный текст *курсивом* |\n| **Alt + ←** | Перейти на предыдущую страницу |\n| **Alt + →** | Перейти на следующую страницу |\n\n---\n\n## 🎨 Настройка внешнего вида (Дизайн)\n\nВ блоке «Дизайн» доступны встроенные темы оформления, адаптированные под разные игровые сеттинги:\n\n- **Тёмная** — Глубокий темный фон и золотой акцент (тема по умолчанию).\n- **Светлая** — Чистый кремовый фон, приятный для чтения длинных текстов.\n- **Сепия** — Тёплые коричневые тона, создающие атмосферу старой книги или свитка.\n- **Лесная** — Уютная тёмно-зелёная палитра.\n- **Океан** — Глубокие, строгие синие тона.\n- **🛠️ Своя тема** — Открывает палитру для полной кастомизации. Вы можете вручную настроить цвета фона, шапки, текста и акцентных элементов.\n\n### 📐 Разметка и Шрифты:\n- **Выбор шрифта:** На выбор доступны *Crimson Pro*, *Georgia*, *Inter*, *JetBrains Mono* и *Palatino*.\n- **Размер текста:** Ползунок с диапазоном от 14 до 22px.\n- **Ширина контента:** 4 режима отображения (Узкая / Стандарт / Широкая / На весь экран).\n- **Элементы интерфейса:** Вы можете парой чекбоксов отключить или включить: шапку с поиском, боковое меню, нижнюю навигацию, кнопку возврата «Наверх» и автоматическое «Содержание» в собранной вики.\n---"},{"title":"4. Сохранение и Экспорт (.wfk)","content":"# 💾 Сохранение проекта и Форматы Экспорта\n\nВ WikiForge реализована надежная многоуровневая система сохранения, которая защищает вашу работу от случайных сбоев, закрытия вкладок или потери компьютера.\n\n## 🔄 Умное автосохранение\nВам не нужно искать кнопку «Сохранить» после каждой строчки. Инструмент автоматически записывает все изменения в базу данных браузера (`localStorage`) через **0.8 секунды** после того, как вы перестали вводить текст. При этом индикатор в правом верхнем углу меняет статус на «сохранено».\n\n---\n\n## 📂 Доступные форматы экспорта\n\nВ самом низу правой панели управления находятся две главные кнопки для вывода данных:\n\n### 1. Собрать вики (Финальный HTML)\nЭта кнопка генерирует и скачивает чистый, самодостаточный файл с расширением `.html`. \n- Это **готовый продукт** для ваших игроков.\n- Из него полностью вырезан режим редактирования, лишние кнопки и панели настроек.\n- Файл весит минимум, открывается мгновенно и имеет красивый пользовательский интерфейс. Закиньте его в архив с вашим проектом!\n\n### 2. ↓ Экспорт проекта .wfk (Исходник)\nЭта кнопка скачивает специальный файл проекта с расширением `.wfk` (формат на базе JSON). \n- Это **ваш рабочий исходник**.\n- Он содержит не просто текущий текст, а абсолютно всё: структуру страниц, кастомные настройки цветов, размеры шрифтов и **всю историю ваших именованных бэкапов**!\n- Вы можете перенести этот файл на другой ПК, отправить соавтору или импортировать через главный экран WikiForge для продолжения работы.\n---"},{"title":"5. Возможности собранной вики","content":"# Как устроена готовая вики-страница\n\nФинальный HTML-файл, который скачивают ваши пользователи — это полноценный, интерактивный и современный сайт документации. Несмотря на то, что он состоит из одного файла, в него вшиты мощные функции:\n\n### 🔍 Умный поисковый движок\nВ шапку страницы встроен локальный поиск, работающий в трех режимах:\n1. **По стр.** — мгновенно ищет совпадения только по заголовкам страниц базы знаний.\n2. **По словам** — находит все страницы, на которых встречаются введенные слова, даже если они написаны в разном порядке.\n3. **Точно** — жесткое и точное совпадение фразы. Поиск подсвечивает найденный текст и выводит интерактивный сниппет (кусочек текста вокруг слова) в результатах для удобства чтения.\n\n### Автоматическое «Содержание» (TOC)\nНа каждой странице автоматически сканируются заголовки уровней H1, H2 и H3. Из них строится кликабельное оглавление. Пользователь может кликнуть по пункту и страница плавно прокрутится к нужному разделу.\n\n### Полная автономность и Офлайн\nФинальный файл занимает всего около ~75 КБ и не требует подключения к интернету. Все скрипты поиска, стили тем и навигация находятся прямо внутри кода. Если у пользователя нет сети, страница автоматически переключится на красивые системные шрифты, сохранив всю верстку.\n\n### Кнопка «↓ .wfk» (Редактирование на лету)\nВ правом нижнем углу готовой вики находится небольшая плавающая кнопка. Если вы (или ваш соавтор) нажмете на нее, страница позволит скачать `.wfk` исходник проекта. Загрузите этот файл обратно в генератор WikiForge — и вы снова сможете редактировать свой гайд!\n\n---\n\n## ℹ️ Кнопка информации в генераторе\nНе забывайте про кнопку **ℹ** в шапке редактора: при наведении на нее прямо во время работы появится компактное всплывающее окно-шпаргалка по Markdown-тегам, хоткеям и режимам работы поиска.\n---"}],"settings":{"theme":"dark","font":"crimson","fontSize":17,"maxWidth":"800px","padding":32,"showHeader":true,"sidebar":true,"bottomNav":true,"scrollTop":true,"toc":true,"footer":true,"footerText":"Создано с помощью WikiForge от DapRatt"},"versions":[{"savedAt":1780813333513,"versionLabel":"v1.0 / основной","pages":[{"title":"Главная","content":"# WikiForge — Генератор офлайн-вики\n\n**Один HTML-файл. Никаких зависимостей. Работает полностью офлайн.**\n\nWikiForge — это ультимативный инструмент для создателей модификаций, дата-паков, игровых сборок и инди-проектов, которым нужна структурированная, функциональная документация.\n\nВам больше не нужно разворачивать тяжелые локальные сервера, использовать сторонний софт или заставлять игроков читать сырые текстовые файлы. Вы просто открываете генератор в любом браузере, оформляете базу знаний и создаете полноценный автономный сайт.\n\n### Ключевые возможности:\n\n- **Single-File Архитектура:** Весь инструмент — это один легкий файл. Итоговая собранная вики — это тоже один чистый HTML-файл, который запускается на любом устройстве без интернета. Идеально для кастомных сборок и архивов с модами!\n- **Удобный редактор с Markdown:** Пишите статьи, оформляйте списки, таблицы и интерактивные спойлеры для скрытия сюжета или тяжелых технических данных. Встроенные хоткеи и панель быстрой разметки сделают работу мгновенной.\n- **Глубокая кастомизация дизайна:** Меняйте темы оформления (от темной до лесной и сепии), настраивайте шрифты, ширину контента и отступы на лету под стилистику вашего проекта.\n- **Локальный контроль версий (Бэкапы):** Создавайте именованные снимки состояния проекта прямо внутри программы. Вы защищены от случайной потери данных и можете в любой момент откатиться к нужной точке сохранения.\n- **Переносимый формат `.wfk`:** Экспортируйте исходники своего проекта в один файл. Формат `.wfk` бережно сохраняет не только текущие страницы и настройки дизайна, но и всю историю ваших внутренних бэкапов. Вдобавок, исходник `.wfk` автоматически вшивается в готовую вики, позволяя отредактировать её в любой момент.\n- **Клиентский поиск:** Готовая вики оснащена мощным поисковым движком с поддержкой точного совпадения, поиска по ключевым словам и динамическим показом сниппетов (кусочков текста вокруг найденного слова).\n\nПросто напишите гайд, нажмите кнопку **«Собрать вики»** — и ваш проект получит интерактивный учебник, готовый к отправке пользователям!"},{"title":"1. Главная и Ввод","content":"# Первое что видно при открытии программы\n## 🖥️ Главный экран приложения\n\nПри открытии WikiForge вас встречает хаб со всеми вашими сохранёнными проектами. Они хранятся автоматически прямо в браузере (`localStorage`) — ничего не теряется между сессиями.\n\n### Что находится на карточке каждого проекта:\n- **Живая миниатюра** — уменьшенный предпросмотр первой страницы с реальным отображением цветов выбранной вами темы.\n- **Основная информация** — название проекта, его текущая версия и краткое описание.\n- **Информация** — количество страниц в вики и дата последнего изменения.\n- **Управление** — кнопки «Редактировать» для перехода в рабочую зону и «Удалить» для полной очистки.\n- **⚙️ Кнопка «ⅴ Версии»** — открывает панель истории созданных бэкапов прямо на карточке проекта.\n\n### ⏳ История версий и бэкапы:\nВы можете сохранить снимок текущую версию вики в любой момент — система запомнит состояние всех страниц и настроек дизайна на текущую секунду. Но не забудьте поменять тег версии, чтоб не запутается, так как бэкап берёт название из версии вики.\n* Все бэкапы отображаются в списке с точной датой и временем.\n* Одним кликом можно откатиться к любой созданной ранее версии.\n\n---"},{"title":"2. Редактор и Markdown","content":"# ✍️ Интерфейс Редактора и Markdown\n\nРабочее пространство WikiForge разделено на три зоны: левая панель с редактором и предпросмотром, нижняя панель навигации по страницам и правая панель глобальных настроек.\n\n## Левая панель: Редактор и Предпросмотр\n\nВы можете мгновенно переключаться между двумя режимами работы:\n1. **▢ Редактор** — удобное поле для написания текста в формате Markdown. Сверху расположено поле для ввода заголовка текущей страницы.\n2. **◉ Предпросмотр** — живой рендер страницы. Сразу показывает, как будет выглядеть результат. Фон, цвета и шрифты меняются в реальном времени при редактировании вики.\n\n---\n\n## 🛠️ Панель инструментов Markdown\n\nВ верхней части редактора расположены кнопки для быстрой вставки форматирования без ручного ввода символов:\n\n- **B** — Жирный текст (`**текст**` / **текст** )\n- *I* — Курсив (`*текст*` / *текст*)\n- Ø — Зачёркнутый (`~~текст~~` / ~~текст~~)\n- **H1 / H2 / H3** — Заголовки разных уровней (`#`, `##`, `###`)\n# текст 1\n## текст 2\n### текст 3\n- **•** — Маркированный список (`-`)\n- **1.** — Нумерованный список (`1.`)\n- **❝** — Цитата или блок внимания (`>`)\n> Текст **Текст** *Текст* ~~Текст ~~ ~~** *Текст* **~~\n- **`</>`** — Инлайн-код (`’код’`)\n- **&#9668;/&#9658;** — Многострочный блок кода (` ’’’ текст ’’’ `)\n```\nТекст, Текст, Текст, Текст, Текст, Текст.\nТекст, Текст, Текст, Текст, Текст, Текст, Текст, Текст, Текст.\n```\n- **🔗** — Вставка ссылки (`[текст ссылки](url)`/ [текст ссылки](https://t.me/SandD_DapRatt))\n- **—** — Горизонтальный разделитель (`---`)\n---\n- **⊞** — Готовая разметка таблицы 3×2 которую можно расширить.\n\n| Колонка 1 | Колонка 2 | Колонка 3 |\n|-----------|-----------|------------|\n| Ячейка    | Ячейка    | Ячейка     |\n| Ячейка    | Ячейка    | Ячейка     |\n\n\n- **▨** — Скрытый текст (`:::spoiler текст:::`/ :::spoiler текст:::)\n\n### Кастомные спойлеры\nСинтаксис `:::spoiler текст:::` размывает контент (эффект блюра). Текст станет четким только после того, как пользователь кликнет по нему. Отлично подходит для скрытия сюжета или квестовых разгадок. Работает как в предпросмотре, так и в финальной сборке.\n\n---\n\n## Нижняя панель навигации\n\nЭлемент управления внизу экрана позволяет быстро переключать структуру:\n`‹   стр. 2 / 5   +   Название страницы   ›   🗑`\n\n* **‹** и **›** — переключение между созданными страницами.\n* **+** — создает новую чистую страницу.\n* **🗑** — безвозвратно удаляет текущую страницу.\n\n---"},{"title":"3. Хоткеи и Кастомизация","content":"# ⚙️ Кастомизация дизайна и Хоткеи\n\nПравая панель отвечает за то, как ваша вики будет выглядеть для конечного пользователя. Все изменения сохраняются на лету.\n\n## ⌨️ Горячие клавиши (Хоткеи)\nИспользование клавиатурных комбинаций значительно ускоряет написание больших гайдов:\n\n| Комбинация | Действие |\n|------------|----------|\n| **Ctrl + B** | Сделать выделенный текст **жирным** |\n| **Ctrl + I** | Сделать выделенный текст *курсивом* |\n| **Alt + ←** | Перейти на предыдущую страницу |\n| **Alt + →** | Перейти на следующую страницу |\n\n---\n\n## 🎨 Настройка внешнего вида (Дизайн)\n\nВ блоке «Дизайн» доступны встроенные темы оформления, адаптированные под разные игровые сеттинги:\n\n- **Тёмная** — Глубокий темный фон и золотой акцент (тема по умолчанию).\n- **Светлая** — Чистый кремовый фон, приятный для чтения длинных текстов.\n- **Сепия** — Тёплые коричневые тона, создающие атмосферу старой книги или свитка.\n- **Лесная** — Уютная тёмно-зелёная палитра.\n- **Океан** — Глубокие, строгие синие тона.\n- **🛠️ Своя тема** — Открывает палитру для полной кастомизации. Вы можете вручную настроить цвета фона, шапки, текста и акцентных элементов.\n\n### 📐 Разметка и Шрифты:\n- **Выбор шрифта:** На выбор доступны *Crimson Pro*, *Georgia*, *Inter*, *JetBrains Mono* и *Palatino*.\n- **Размер текста:** Ползунок с диапазоном от 14 до 22px.\n- **Ширина контента:** 4 режима отображения (Узкая / Стандарт / Широкая / На весь экран).\n- **Элементы интерфейса:** Вы можете парой чекбоксов отключить или включить: шапку с поиском, боковое меню, нижнюю навигацию, кнопку возврата «Наверх» и автоматическое «Содержание» в собранной вики.\n---"},{"title":"4. Сохранение и Экспорт (.wfk)","content":"# 💾 Сохранение проекта и Форматы Экспорта\n\nВ WikiForge реализована надежная многоуровневая система сохранения, которая защищает вашу работу от случайных сбоев, закрытия вкладок или потери компьютера.\n\n## 🔄 Умное автосохранение\nВам не нужно искать кнопку «Сохранить» после каждой строчки. Инструмент автоматически записывает все изменения в базу данных браузера (`localStorage`) через **0.8 секунды** после того, как вы перестали вводить текст. При этом индикатор в правом верхнем углу меняет статус на «сохранено».\n\n---\n\n## 📂 Доступные форматы экспорта\n\nВ самом низу правой панели управления находятся две главные кнопки для вывода данных:\n\n### 1. Собрать вики (Финальный HTML)\nЭта кнопка генерирует и скачивает чистый, самодостаточный файл с расширением `.html`. \n- Это **готовый продукт** для ваших игроков.\n- Из него полностью вырезан режим редактирования, лишние кнопки и панели настроек.\n- Файл весит минимум, открывается мгновенно и имеет красивый пользовательский интерфейс. Закиньте его в архив с вашим проектом!\n\n### 2. ↓ Экспорт проекта .wfk (Исходник)\nЭта кнопка скачивает специальный файл проекта с расширением `.wfk` (формат на базе JSON). \n- Это **ваш рабочий исходник**.\n- Он содержит не просто текущий текст, а абсолютно всё: структуру страниц, кастомные настройки цветов, размеры шрифтов и **всю историю ваших именованных бэкапов**!\n- Вы можете перенести этот файл на другой ПК, отправить соавтору или импортировать через главный экран WikiForge для продолжения работы.\n---"},{"title":"5. Возможности собранной вики","content":"# Как устроена готовая вики-страница\n\nФинальный HTML-файл, который скачивают ваши пользователи — это полноценный, интерактивный и современный сайт документации. Несмотря на то, что он состоит из одного файла, в него вшиты мощные функции:\n\n### 🔍 Умный поисковый движок\nВ шапку страницы встроен локальный поиск, работающий в трех режимах:\n1. **По стр.** — мгновенно ищет совпадения только по заголовкам страниц базы знаний.\n2. **По словам** — находит все страницы, на которых встречаются введенные слова, даже если они написаны в разном порядке.\n3. **Точно** — жесткое и точное совпадение фразы. Поиск подсвечивает найденный текст и выводит интерактивный сниппет (кусочек текста вокруг слова) в результатах для удобства чтения.\n\n### Автоматическое «Содержание» (TOC)\nНа каждой странице автоматически сканируются заголовки уровней H1, H2 и H3. Из них строится кликабельное оглавление. Пользователь может кликнуть по пункту и страница плавно прокрутится к нужному разделу.\n\n### Полная автономность и Офлайн\nФинальный файл занимает всего около ~50 КБ и не требует подключения к интернету. Все скрипты поиска, стили тем и навигация находятся прямо внутри кода. Если у пользователя нет сети, страница автоматически переключится на красивые системные шрифты, сохранив всю верстку.\n\n### Кнопка «↓ .wfk» (Редактирование на лету)\nВ правом нижнем углу готовой вики находится небольшая плавающая кнопка. Если вы (или ваш соавтор) нажмете на нее, страница позволит скачать `.wfk` исходник проекта. Загрузите этот файл обратно в генератор WikiForge — и вы снова сможете редактировать свой гайд!\n\n---\n\n## ℹ️ Кнопка информации в генераторе\nНе забывайте про кнопку **ℹ** в шапке редактора: при наведении на нее прямо во время работы появится компактное всплывающее окно-шпаргалка по Markdown-тегам, хоткеям и режимам работы поиска.\n---"}],"settings":{"theme":"dark","font":"crimson","fontSize":17,"maxWidth":"800px","padding":32,"showHeader":true,"sidebar":true,"bottomNav":true,"scrollTop":true,"toc":true,"footer":true,"footerText":"Создано с помощью WikiForge от DapRatt"}},{"savedAt":1780813557441,"versionLabel":"v1.1 / правки","pages":[{"title":"Главная","content":"# WikiForge — Генератор офлайн-вики\n\n**Один HTML-файл. Никаких зависимостей. Работает полностью офлайн.**\n\nWikiForge — это ультимативный инструмент для создателей модификаций, дата-паков, игровых сборок и инди-проектов, которым нужна структурированная, функциональная документация.\n\nВам больше не нужно разворачивать тяжелые локальные сервера, использовать сторонний софт или заставлять игроков читать сырые текстовые файлы. Вы просто открываете генератор в любом браузере, оформляете базу знаний и создаете полноценный автономный сайт.\n\n### Ключевые возможности:\n\n- **Single-File Архитектура:** Весь инструмент — это один легкий файл. Итоговая собранная вики — это тоже один чистый HTML-файл, который запускается на любом устройстве без интернета. Идеально для кастомных сборок и архивов с модами!\n- **Удобный редактор с Markdown:** Пишите статьи, оформляйте списки, таблицы и интерактивные спойлеры для скрытия сюжета или тяжелых технических данных. Встроенные хоткеи и панель быстрой разметки сделают работу мгновенной.\n- **Глубокая кастомизация дизайна:** Меняйте темы оформления (от темной до лесной и сепии), настраивайте шрифты, ширину контента и отступы на лету под стилистику вашего проекта.\n- **Локальный контроль версий (Бэкапы):** Создавайте именованные снимки состояния проекта прямо внутри программы. Вы защищены от случайной потери данных и можете в любой момент откатиться к нужной точке сохранения.\n- **Переносимый формат `.wfk`:** Экспортируйте исходники своего проекта в один файл. Формат `.wfk` бережно сохраняет не только текущие страницы и настройки дизайна, но и всю историю ваших внутренних бэкапов. Вдобавок, исходник `.wfk` автоматически вшивается в готовую вики, позволяя отредактировать её в любой момент.\n- **Клиентский поиск:** Готовая вики оснащена мощным поисковым движком с поддержкой точного совпадения, поиска по ключевым словам и динамическим показом сниппетов (кусочков текста вокруг найденного слова).\n\nПросто напишите гайд, нажмите кнопку **«Собрать вики»** — и ваш проект получит интерактивный учебник, готовый к отправке пользователям!"},{"title":"1. Главная и Ввод","content":"# Первое что видно при открытии программы\n## 🖥️ Главный экран приложения\n\nПри открытии WikiForge вас встречает хаб со всеми вашими сохранёнными проектами. Они хранятся автоматически прямо в браузере (`localStorage`) — ничего не теряется между сессиями.\n\n### Что находится на карточке каждого проекта:\n- **Живая миниатюра** — уменьшенный предпросмотр первой страницы с реальным отображением цветов выбранной вами темы.\n- **Основная информация** — название проекта, его текущая версия и краткое описание.\n- **Информация** — количество страниц в вики и дата последнего изменения.\n- **Управление** — кнопки «Редактировать» для перехода в рабочую зону и «Удалить» для полной очистки.\n- **⚙️ Кнопка «ⅴ Версии»** — открывает панель истории созданных бэкапов прямо на карточке проекта.\n\n### ⏳ История версий и бэкапы:\nВы можете сохранить снимок текущую версию вики в любой момент — система запомнит состояние всех страниц и настроек дизайна на текущую секунду. Но не забудьте поменять тег версии, чтоб не запутается, так как бэкап берёт название из версии вики.\n* Все бэкапы отображаются в списке с точной датой и временем.\n* Одним кликом можно откатиться к любой созданной ранее версии.\n\n---"},{"title":"2. Редактор и Markdown","content":"# ✍️ Интерфейс Редактора и Markdown\n\nРабочее пространство WikiForge разделено на три зоны: левая панель с редактором и предпросмотром, нижняя панель навигации по страницам и правая панель глобальных настроек.\n\n## Левая панель: Редактор и Предпросмотр\n\nВы можете мгновенно переключаться между двумя режимами работы:\n1. **▢ Редактор** — удобное поле для написания текста в формате Markdown. Сверху расположено поле для ввода заголовка текущей страницы.\n2. **◉ Предпросмотр** — живой рендер страницы. Сразу показывает, как будет выглядеть результат. Фон, цвета и шрифты меняются в реальном времени при редактировании вики.\n\n---\n\n## 🛠️ Панель инструментов Markdown\n\nВ верхней части редактора расположены кнопки для быстрой вставки форматирования без ручного ввода символов:\n\n- **B** — Жирный текст (`**текст**` / **текст** )\n- *I* — Курсив (`*текст*` / *текст*)\n- Ø — Зачёркнутый (`~~текст~~` / ~~текст~~)\n- **H1 / H2 / H3** — Заголовки разных уровней (`#`, `##`, `###`)\n# текст 1\n## текст 2\n### текст 3\n- **•** — Маркированный список (`-`)\n- **1.** — Нумерованный список (`1.`)\n- **❝** — Цитата или блок внимания (`>`)\n> Текст **Текст** *Текст* ~~Текст ~~ ~~** *Текст* **~~\n- **`</>`** — Инлайн-код (`’код’`)\n- **&#9668;/&#9658;** — Многострочный блок кода (` ’’’ текст ’’’ `)\n```\nТекст, Текст, Текст, Текст, Текст, Текст.\nТекст, Текст, Текст, Текст, Текст, Текст, Текст, Текст, Текст.\n```\n- **🔗** — Вставка ссылки (`[текст ссылки](url)`/ [текст ссылки](https://t.me/SandD_DapRatt))\n- **—** — Горизонтальный разделитель (`---`)\n---\n- **⊞** — Готовая разметка таблицы 3×2 которую можно расширить.\n\n| Колонка 1 | Колонка 2 | Колонка 3 |\n|-----------|-----------|------------|\n| Ячейка    | Ячейка    | Ячейка     |\n| Ячейка    | Ячейка    | Ячейка     |\n\n\n- **▨** — Скрытый текст (`:::spoiler текст:::`/ :::spoiler текст:::)\n\n### Кастомные спойлеры\nСинтаксис `:::spoiler текст:::` размывает контент (эффект блюра). Текст станет четким только после того, как пользователь кликнет по нему. Отлично подходит для скрытия сюжета или квестовых разгадок. Работает как в предпросмотре, так и в финальной сборке.\n\n---\n\n## Нижняя панель навигации\n\nЭлемент управления внизу экрана позволяет быстро переключать структуру:\n`‹   стр. 2 / 5   +   Название страницы   ›   🗑`\n\n* **‹** и **›** — переключение между созданными страницами.\n* **+** — создает новую чистую страницу.\n* **🗑** — безвозвратно удаляет текущую страницу.\n\n---"},{"title":"3. Хоткеи и Кастомизация","content":"# ⚙️ Кастомизация дизайна и Хоткеи\n\nПравая панель отвечает за то, как ваша вики будет выглядеть для конечного пользователя. Все изменения сохраняются на лету.\n\n## ⌨️ Горячие клавиши (Хоткеи)\nИспользование клавиатурных комбинаций значительно ускоряет написание больших гайдов:\n\n| Комбинация | Действие |\n|------------|----------|\n| **Ctrl + B** | Сделать выделенный текст **жирным** |\n| **Ctrl + I** | Сделать выделенный текст *курсивом* |\n| **Alt + ←** | Перейти на предыдущую страницу |\n| **Alt + →** | Перейти на следующую страницу |\n\n---\n\n## 🎨 Настройка внешнего вида (Дизайн)\n\nВ блоке «Дизайн» доступны встроенные темы оформления, адаптированные под разные игровые сеттинги:\n\n- **Тёмная** — Глубокий темный фон и золотой акцент (тема по умолчанию).\n- **Светлая** — Чистый кремовый фон, приятный для чтения длинных текстов.\n- **Сепия** — Тёплые коричневые тона, создающие атмосферу старой книги или свитка.\n- **Лесная** — Уютная тёмно-зелёная палитра.\n- **Океан** — Глубокие, строгие синие тона.\n- **🛠️ Своя тема** — Открывает палитру для полной кастомизации. Вы можете вручную настроить цвета фона, шапки, текста и акцентных элементов.\n\n### 📐 Разметка и Шрифты:\n- **Выбор шрифта:** На выбор доступны *Crimson Pro*, *Georgia*, *Inter*, *JetBrains Mono* и *Palatino*.\n- **Размер текста:** Ползунок с диапазоном от 14 до 22px.\n- **Ширина контента:** 4 режима отображения (Узкая / Стандарт / Широкая / На весь экран).\n- **Элементы интерфейса:** Вы можете парой чекбоксов отключить или включить: шапку с поиском, боковое меню, нижнюю навигацию, кнопку возврата «Наверх» и автоматическое «Содержание» в собранной вики.\n---"},{"title":"4. Сохранение и Экспорт (.wfk)","content":"# 💾 Сохранение проекта и Форматы Экспорта\n\nВ WikiForge реализована надежная многоуровневая система сохранения, которая защищает вашу работу от случайных сбоев, закрытия вкладок или потери компьютера.\n\n## 🔄 Умное автосохранение\nВам не нужно искать кнопку «Сохранить» после каждой строчки. Инструмент автоматически записывает все изменения в базу данных браузера (`localStorage`) через **0.8 секунды** после того, как вы перестали вводить текст. При этом индикатор в правом верхнем углу меняет статус на «сохранено».\n\n---\n\n## 📂 Доступные форматы экспорта\n\nВ самом низу правой панели управления находятся две главные кнопки для вывода данных:\n\n### 1. Собрать вики (Финальный HTML)\nЭта кнопка генерирует и скачивает чистый, самодостаточный файл с расширением `.html`. \n- Это **готовый продукт** для ваших игроков.\n- Из него полностью вырезан режим редактирования, лишние кнопки и панели настроек.\n- Файл весит минимум, открывается мгновенно и имеет красивый пользовательский интерфейс. Закиньте его в архив с вашим проектом!\n\n### 2. ↓ Экспорт проекта .wfk (Исходник)\nЭта кнопка скачивает специальный файл проекта с расширением `.wfk` (формат на базе JSON). \n- Это **ваш рабочий исходник**.\n- Он содержит не просто текущий текст, а абсолютно всё: структуру страниц, кастомные настройки цветов, размеры шрифтов и **всю историю ваших именованных бэкапов**!\n- Вы можете перенести этот файл на другой ПК, отправить соавтору или импортировать через главный экран WikiForge для продолжения работы.\n---"},{"title":"5. Возможности собранной вики","content":"# Как устроена готовая вики-страница\n\nФинальный HTML-файл, который скачивают ваши пользователи — это полноценный, интерактивный и современный сайт документации. Несмотря на то, что он состоит из одного файла, в него вшиты мощные функции:\n\n### 🔍 Умный поисковый движок\nВ шапку страницы встроен локальный поиск, работающий в трех режимах:\n1. **По стр.** — мгновенно ищет совпадения только по заголовкам страниц базы знаний.\n2. **По словам** — находит все страницы, на которых встречаются введенные слова, даже если они написаны в разном порядке.\n3. **Точно** — жесткое и точное совпадение фразы. Поиск подсвечивает найденный текст и выводит интерактивный сниппет (кусочек текста вокруг слова) в результатах для удобства чтения.\n\n### Автоматическое «Содержание» (TOC)\nНа каждой странице автоматически сканируются заголовки уровней H1, H2 и H3. Из них строится кликабельное оглавление. Пользователь может кликнуть по пункту и страница плавно прокрутится к нужному разделу.\n\n### Полная автономность и Офлайн\nФинальный файл занимает всего около ~75 КБ и не требует подключения к интернету. Все скрипты поиска, стили тем и навигация находятся прямо внутри кода. Если у пользователя нет сети, страница автоматически переключится на красивые системные шрифты, сохранив всю верстку.\n\n### Кнопка «↓ .wfk» (Редактирование на лету)\nВ правом нижнем углу готовой вики находится небольшая плавающая кнопка. Если вы (или ваш соавтор) нажмете на нее, страница позволит скачать `.wfk` исходник проекта. Загрузите этот файл обратно в генератор WikiForge — и вы снова сможете редактировать свой гайд!\n\n---\n\n## ℹ️ Кнопка информации в генераторе\nНе забывайте про кнопку **ℹ** в шапке редактора: при наведении на нее прямо во время работы появится компактное всплывающее окно-шпаргалка по Markdown-тегам, хоткеям и режимам работы поиска.\n---"}],"settings":{"theme":"dark","font":"crimson","fontSize":17,"maxWidth":"800px","padding":32,"showHeader":true,"sidebar":true,"bottomNav":true,"scrollTop":true,"toc":true,"footer":true,"footerText":"Создано с помощью WikiForge от DapRatt"}}],"updatedAt":1780813518162};
var curPage = 0;
var searchMode = 'pages';

function parseMarkdown(md) {
  if (!md) return "";
  var html = md;
  function escH(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  var cb = [];
  html = html.replace(/```[\s\S]*?```/g, function(m) { var code=m.replace(/^```\w*\n?/,"").replace(/```$/,""); cb.push("<pre><code>"+escH(code.trim())+"</code></pre>"); return "\x00C"+(cb.length-1)+"\x00"; });
  var ic = [];
  html = html.replace(/`([^`]+)`/g, function(m,c) { ic.push("<code>"+escH(c)+"</code>"); return "\x00I"+(ic.length-1)+"\x00"; });
  html = html.replace(/:::spoiler ([\s\S]+?):::/g, function(m,text) { return "<span class=\"spoiler\"><span class=\"spoiler-text\">"+text.trim()+"</span></span>"; });
  html = html.replace(/(\|.+\|)\n(\|[-: |]+\|)\n((?:\|.+\|[\n]?)+)/g, function(match,header,sep,rows) { var ths=header.trim().split("|").filter(function(c){return c.trim();}).map(function(c){return "<th>"+c.trim()+"</th>";}).join(""); var trs=rows.trim().split("\n").map(function(r){return "<tr>"+r.split("|").filter(function(c){return c.trim();}).map(function(c){return "<td>"+c.trim()+"</td>";}).join("")+"</tr>";}).join(""); return "<table><thead><tr>"+ths+"</tr></thead><tbody>"+trs+"</tbody></table>\n"; });
  html = html.replace(/^#{6} (.+)$/gm,"<h6>$1</h6>").replace(/^#{5} (.+)$/gm,"<h5>$1</h5>").replace(/^#{4} (.+)$/gm,"<h4>$1</h4>").replace(/^### (.+)$/gm,"<h3>$1</h3>").replace(/^## (.+)$/gm,"<h2>$1</h2>").replace(/^# (.+)$/gm,"<h1>$1</h1>");
  html = html.replace(/^---+$/gm,"<hr>");
  html = html.replace(/\*\*\*(.+?)\*\*\*/g,"<strong><em>$1</em></strong>").replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/\*(.+?)\*/g,"<em>$1</em>").replace(/~~(.+?)~~/g,"<del>$1</del>");
  html = html.replace(/^> (.+)$/gm,"<blockquote>$1</blockquote>");
  html = html.replace(/!\[([^\]]*)\]\(([^)]+)\)/g,"<img src=\"$2\" alt=\"$1\">");
  html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g,"<a href=\"$2\">$1</a>");
  html = html.replace(/(^- .+(\n|$))+/gm, function(match) { return "<ul>"+match.trim().split("\n").map(function(l){return "<li>"+l.replace(/^- /,"").trim()+"</li>";}).join("")+"</ul>\n"; });
  html = html.replace(/(^\d+\. .+(\n|$))+/gm, function(match) { return "<ol>"+match.trim().split("\n").map(function(l){return "<li>"+l.replace(/^\d+\. /,"").trim()+"</li>";}).join("")+"</ol>\n"; });
  html = html.split("\n\n").map(function(b) { b=b.trim(); if(!b)return ""; if(/^<(h[1-6]|ul|ol|pre|table|blockquote|hr)/.test(b)||b.charAt(0)==="\x00")return b; return "<p>"+b.replace(/\n/g,"<br>")+"</p>"; }).join("\n");
  for(var ci=0;ci<cb.length;ci++) html=html.replace("\x00C"+ci+"\x00",cb[ci]);
  for(var ii=0;ii<ic.length;ii++) html=html.replace("\x00I"+ii+"\x00",ic[ii]);
  return html;
}

function buildToc(c){
  var hh=(c.match(/^#{1,3} .+/gm)||[]);
  if(hh.length<2)return '';
  var r='<div class="toc"><div class="toc-title">Содержание</div><ul>';
  hh.forEach(function(h){var lv=h.match(/^#+/)[0].length;var tx=h.replace(/^#+\s*/,'');var id=tx.toLowerCase().replace(/[^a-z\u0400-\u04ff0-9]/gi,'_');r+='<li class="toc-l'+lv+'"><a href="#'+id+'">'+tx+'</a></li>';});
  return r+'</ul></div>';
}
function addIDs(html){return html.replace(/<h([1-3])>([^<]+)<\/h\1>/g,function(m,lv,tx){var id=tx.toLowerCase().replace(/[^a-z\u0400-\u04ff0-9]/gi,'_');return '<h'+lv+' id="'+id+'">'+tx+'</h'+lv+'>';});}
function buildPages(){
  var c=document.getElementById('pages-container');c.innerHTML='';
  PAGES.forEach(function(p,i){
    var d=document.createElement('div');d.className='page-sec'+(i===0?' active':'');d.id='p-'+i;
    var ch=parseMarkdown(p.content);var toc=buildToc(p.content);
    d.innerHTML='<div class="md">'+toc+addIDs(ch)+'</div>';
    c.appendChild(d);
    d.querySelectorAll('.spoiler').forEach(function(el){el.onclick=function(){el.classList.toggle('revealed');};});
  });
}
function buildSidebar(){
  var sb=document.getElementById('sb-pages');if(!sb)return;
  sb.innerHTML=PAGES.map(function(p,i){return '<div class="sb-link'+(i===0?' active ':' ')+'" onclick="showPage('+i+')">'+p.title+'</div>';}).join('');
}
function showPage(idx){
  if(idx<0||idx>=PAGES.length)return;
  document.querySelectorAll('.page-sec').forEach(function(el,i){el.classList.toggle('active',i===idx);});
  document.querySelectorAll('.sb-link').forEach(function(el,i){el.classList.toggle('active',i===idx);});
  var db=document.getElementById('wiki-desc');if(db)db.style.display=(idx===0)?'':'none';
  curPage=idx;
  document.getElementById('content-wrap').scrollTo({top:0,behavior:'smooth'});
  updateNav();
}
function changePage(idx){showPage(idx);}
function updateNav(){
  var pv=document.getElementById('btn-prev');var nx=document.getElementById('btn-next');var ct=document.getElementById('nav-ctr');
  if(pv)pv.disabled=curPage===0;if(nx)nx.disabled=curPage===PAGES.length-1;if(ct)ct.textContent=(curPage+1)+' / '+PAGES.length;
}
function setSM(m){
  searchMode=m;
  ['pages','keywords','exact'].forEach(function(k){var b=document.getElementById('sm-'+k);if(b)b.classList.toggle('active',k===m);});
  var inp=document.getElementById('s-input');
  if(inp){inp.placeholder={pages:'По заголовкам...',keywords:'По словам...',exact:'Точный текст...'}[m];doSearch(inp.value);}
}
function hlQ(text,q){if(!q)return text;var e=q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');return text.replace(new RegExp(e,'gi'),function(m){return '<mark>'+m+'</mark>';});}
function doSearch(q){
  var box=document.getElementById('s-results');if(!q||!q.trim()){box.style.display='none';return;}
  var res=[];
  if(searchMode==='pages'){
    PAGES.forEach(function(p,i){if(p.title.toLowerCase().indexOf(q.toLowerCase())>=0)res.push({i:i,title:hlQ(p.title,q),ex:''});});
  } else if(searchMode==='keywords'){
    var wds=q.toLowerCase().split(/\s+/).filter(Boolean);
    PAGES.forEach(function(p,i){var tl=(p.title+' '+p.content).toLowerCase();var found=wds.filter(function(w){return tl.indexOf(w)>=0;});if(found.length>0){var idx2=p.content.toLowerCase().indexOf(wds[0]);var raw=idx2>=0?p.content.substring(Math.max(0,idx2-40),idx2+100).replace(/[#*`|>]/g,''):'';var ex=wds.reduce(function(t,w){return hlQ(t,w);},raw);res.push({i:i,title:p.title,ex:ex+'...'});}});
  } else {
    PAGES.forEach(function(p,i){var full=p.title+' '+p.content;if(full.toLowerCase().indexOf(q.toLowerCase())>=0){var idx2=full.toLowerCase().indexOf(q.toLowerCase());var raw=full.substring(Math.max(0,idx2-40),idx2+100).replace(/[#*`|>]/g,'');res.push({i:i,title:p.title,ex:hlQ(raw,q)+'...'});}});
  }
  if(!res.length){box.innerHTML='<div class="s-no-results">Ничего не найдено</div>';box.style.display='block';return;}
  box.innerHTML=res.map(function(r){return '<div class="s-result" onclick="showPage('+r.i+');document.getElementById(\'s-input\').value=\'\';hideSR()"><div class="s-result-title">'+r.title+'</div><div class="s-result-excerpt">'+r.ex+'</div></div>';}).join('');
  box.style.display='block';
}
function hideSR(){var b=document.getElementById('s-results');if(b)b.style.display='none';}
function exportWFK(){
  var data=JSON.stringify({wfk:1,wiki:WIKI},null,2);
  var fname=(WIKI.name||'wiki').replace(/[^\u0400-\u04ffa-z0-9_\- ]/gi,'_').replace(/\s+/g,'_')+'.wfk';
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=fname;a.click();setTimeout(function(){URL.revokeObjectURL(a.href);},1000);
}
document.getElementById('content-wrap').addEventListener('scroll',function(){var b=document.getElementById('scroll-top');if(b)b.classList.toggle('visible',this.scrollTop>300);},{passive:true});
buildPages();buildSidebar();updateNav();
</script>
</body>
